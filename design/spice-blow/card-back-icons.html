<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spice blow: card-back headers with icons</title>
<style>
@font-face { font-family: "Advokat"; src: url("../../treachery-online/Client/wwwroot/Advokat.ttf"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-400-latin.woff2") format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-500-latin.woff2") format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-700-latin.woff2") format("woff2"); }
@font-face { font-family: "Copperplate Dune"; src: url("../../treachery-online/Client/wwwroot/Copperplate.ttf"); }
:root{
  --ink-0:#120800;--ink-1:#1d0c00;--ink-2:#2a1607;--ink-3:#3b2310;--ink-4:#4e3218;
  --parchment:#fcf9d1;--sand:#f3d987;--rock:#b3915f;--gold:#e7bf3c;
  --text:var(--parchment);--text-2:#d9c79a;--text-3:#a68d63;
  --font-display:"Advokat",serif;--font-label:"Copperplate Dune","Copperplate",serif;--font-body:"Alegreya Sans",Candara,sans-serif;
  --hair:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink-1);color:var(--text);font-family:var(--font-body);padding:32px 48px 80px;font-size:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0 0 6px}
p{color:var(--rock);max-width:80ch;line-height:1.45;margin:0 0 8px}
.lbl{font-family:var(--font-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,390px);gap:28px 40px;margin-top:24px}

.panel{background:var(--ink-2);border:1px solid var(--hair);border-radius:6px;width:390px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--hair)}
.nav .arr{width:32px;height:40px;display:grid;place-items:center;border-radius:5px;color:var(--gold);font-size:26px}
.nav .arr.l{background:rgba(255,255,255,.04)}
.nav .mid{text-align:center}
.nav .t{font-family:var(--font-label);font-size:11px;letter-spacing:.16em;color:var(--text-3)}
.nav .p{font-family:var(--font-display);font-size:20px;color:var(--sand);line-height:1.1}
.bd{padding:6px 10px 10px}
.line{font-size:15px;line-height:1.95}
.line b{font-weight:700;color:var(--parchment)}
.spice-amt{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;vertical-align:middle;line-height:1}
.spice-amt img{position:absolute;inset:0;width:100%;height:100%}
.spice-amt b{position:relative;font-family:var(--font-display);font-weight:400!important;font-size:12.5px;color:var(--parchment)!important;text-shadow:0 0 1px #000,0 0 1px #000,0 0 3px #000}
img.worm{width:22px;height:22px;vertical-align:middle;filter:drop-shadow(1px 1px 2px #000)}

/* chip, copied from treachery.css */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 3px;border-radius:999px;background:rgba(18,8,0,.55);border:1px solid rgba(252,249,209,.12);font-size:14px;color:var(--text);line-height:1;white-space:nowrap;vertical-align:middle}
.chip .name{font-weight:600;letter-spacing:.01em}
.chip .sector{font-family:var(--font-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.chip .wedge{width:20px;height:20px;flex:none}

/* card-back header */
.h{display:flex;align-items:center;gap:8px;padding:8px 0 2px}
.grp:first-child .h{padding-top:2px}
.h img{width:16px;height:22px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.h .n{font-family:var(--font-display);font-size:15px;color:var(--sand)}
</style></head><body>

<h1>Spice blow: card-back headers with icons</h1>
<p>Before is what the app shows now. After keeps the card-back header, shows the worm as its icon, and puts the place in a chip. The spice line names the exact sector the spice landed in, since that's where it sits on the map.</p>
<div class="grid" id="grid"></div>

<script src="../log-refs/mapdata.js"></script>
<script>
const ART = "../../treachery-online/Client/wwwroot/art/";
const M = window.MAPDATA, C = {cx:281, cy:311, r:242, n:18};
const tid = name => +Object.entries(M.territories).find(([, t]) => t.name === name)[0];
const locs = (name, o) => M.locations.filter(l => l.territory === tid(name) && (o === undefined || l.orientation === o));
function wedge(s, cx, cy, r) {
  const a0 = 2*Math.PI*(6-s)/C.n, a1 = 2*Math.PI*(5-s)/C.n;
  return `M ${cx},${cy} L ${cx+Math.cos(a0)*r},${cy+Math.sin(a0)*r} A ${r} ${r} 20 0 0 ${cx+Math.cos(a1)*r},${cy+Math.sin(a1)*r} Z`;
}
// Same idea as PlaceChip.razor: the place's outline on the planet disc, clipped to its sector,
// scaled up about its own centre until it is at least a fifth of the disc wide.
// Bounding box of the filled outline, restricted to the sector when there is one. Found by sampling a grid.
const ctx = document.createElement("canvas").getContext("2d");
function bbox(path, sector) {
  const shape = new Path2D(path), a0 = 2*Math.PI*(5-sector)/C.n, span = 2*Math.PI/C.n;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let x = C.cx - C.r; x <= C.cx + C.r; x += 1.5) for (let y = C.cy - C.r; y <= C.cy + C.r; y += 1.5) {
    if (!ctx.isPointInPath(shape, x, y)) continue;
    if (sector >= 0 && ((Math.atan2(y - C.cy, x - C.cx) - a0) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) > span) continue;
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  return [x0, y0, x1, y1];
}
let gid = 0;
function glyph(ls) {
  const id = "g" + gid++, r = C.r, d = 2 * r + 6;
  const path = M.territories[ls[0].territory].path;
  const sectored = ls.length === 1 && ls[0].sector >= 0;
  const [x0, y0, x1, y1] = bbox(path, sectored ? ls[0].sector : -1);
  const size = Math.max(x1 - x0, y1 - y0), grow = Math.max(1, 0.2 * 2 * r / size);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const clip = sectored ? `<clipPath id="${id}-s"><path d="${wedge(ls[0].sector, C.cx, C.cy, r)}"/></clipPath>` : "";
  return `<svg class="wedge" viewBox="${C.cx - r - 3} ${C.cy - r - 3} ${d} ${d}"><defs><clipPath id="${id}-d"><circle cx="${C.cx}" cy="${C.cy}" r="${r}"/></clipPath>${clip}</defs>
    <g clip-path="url(#${id}-d)"><circle cx="${C.cx}" cy="${C.cy}" r="${r}" fill="var(--ink-4)"/>
    <g transform="translate(${cx},${cy}) scale(${grow}) translate(${-cx},${-cy})"><g ${sectored ? `clip-path="url(#${id}-s)"` : ""}><path d="${path}" fill="var(--gold)"/></g></g></g>
    <circle cx="${C.cx}" cy="${C.cy}" r="${r}" fill="none" stroke="var(--rock)" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}
const chip = (name, o) => `<span class="chip">${glyph(locs(name, o))}<span class="name">${name}</span>${o ? `<span class="sector">${o}</span>` : ""}</span>`;
const S = n => `<span class="spice-amt"><img src="${ART}ActiveSpice.svg"><b>${n}</b></span>`;
const W = `<img class="worm" src="${ART}monster.svg" alt="Shai-Hulud" title="Shai-Hulud">`;

const before = {
  simple: {A:[`${S(8)} detected in <b>The Minor Erg</b>`], B:[`${S(10)} detected in <b>South Mesa</b>`]},
  busy: {A:[`${W} devours ${S(6)} in ${chip("Hagga Basin")}`, `${W} appears in ${chip("Hagga Basin")}`, `${S(8)} detected in <b>The Minor Erg</b>`], B:[`${S(10)} detected in <b>South Mesa</b>`]},
};
const after = {
  simple: {A:[`${S(8)} detected in ${chip("The Minor Erg", "Far North")}`], B:[`${S(10)} detected in ${chip("South Mesa", "Middle")}`]},
  busy: {A:[`${W} devours ${S(6)} in ${chip("Hagga Basin")}`, `${W} appears in ${chip("Hagga Basin")}`, `${S(8)} detected in ${chip("The Minor Erg", "Far North")}`], B:[`${S(10)} detected in ${chip("South Mesa", "Middle")}`]},
};

const nav = `<div class="nav"><div class="arr l">‹</div><div class="mid"><div class="t">TURN 2</div><div class="p">Spice Blow</div></div><div class="arr">›</div></div>`;
const L = ls => ls.map(l => `<div class="line">${l}</div>`).join("");
const renderBefore = d => Object.entries(d).map(([k, ls]) => `<div class="line">*** Spice Blow ${k} ***</div>` + L(ls)).join("");
const renderAfter = d => Object.entries(d).map(([k, ls]) =>
  `<div class="grp"><div class="h"><img src="${ART}SpiceBack.gif"><span class="n">Deck ${k}</span></div>${L(ls)}</div>`).join("");
const cell = (label, body) => `<div><div class="lbl">${label}</div><div class="panel">${nav}<div class="bd">${body}</div></div></div>`;

document.getElementById("grid").innerHTML =
  cell("Before", renderBefore(before.simple)) + cell("After", renderAfter(after.simple)) +
  cell("Before, with a worm", renderBefore(before.busy)) + cell("After, with a worm", renderAfter(after.busy));
</script>
</body></html>
