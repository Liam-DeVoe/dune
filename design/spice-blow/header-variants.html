<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spice blow headers: variants</title>
<style>
@font-face { font-family: "Advokat"; src: url("../../treachery-online/Client/wwwroot/Advokat.ttf"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-400-latin.woff2") format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-500-latin.woff2") format("woff2"); }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url("../../treachery-online/Client/wwwroot/fonts/AlegreyaSans-700-latin.woff2") format("woff2"); }
@font-face { font-family: "Copperplate Dune"; src: url("../../treachery-online/Client/wwwroot/Copperplate.ttf"); }
:root{
  --ink-0:#120800;--ink-1:#1d0c00;--ink-2:#2a1607;--ink-3:#3b2310;--ink-4:#4e3218;
  --parchment:#fcf9d1;--sand:#f3d987;--rock:#b3915f;--gold:#e7bf3c;--spice:#e8762a;
  --text:var(--parchment);--text-2:#d9c79a;--text-3:#a68d63;
  --font-display:"Advokat",serif;--font-label:"Copperplate Dune","Copperplate",serif;--font-body:"Alegreya Sans",Candara,sans-serif;
  --hair:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink-1);color:var(--text);font-family:var(--font-body);padding:32px 48px 80px;font-size:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:36px;margin:0 0 6px}
h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:44px 0 4px;color:var(--gold)}
p{color:var(--rock);max-width:80ch;line-height:1.45;margin:0 0 8px}
.row{display:flex;gap:40px;margin-top:14px;align-items:flex-start}

.panel{background:var(--ink-2);border:1px solid var(--hair);border-radius:6px;width:370px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--hair)}
.nav .arr{width:32px;height:40px;display:grid;place-items:center;border-radius:5px;color:var(--gold);font-size:26px}
.nav .arr.l{background:rgba(255,255,255,.04)}
.nav .mid{text-align:center}
.nav .t{font-family:var(--font-label);font-size:11px;letter-spacing:.16em;color:var(--text-3)}
.nav .p{font-family:var(--font-display);font-size:20px;color:var(--sand);line-height:1.1}
.bd{padding:6px 10px 10px}
.line{font-size:15px;line-height:1.95}
.line b{font-weight:700;color:var(--parchment)}
.spice-amt{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;vertical-align:middle;line-height:1;margin-right:2px}
.spice-amt img{position:absolute;inset:0;width:100%;height:100%}
.spice-amt b{position:relative;font-family:var(--font-display);font-weight:400!important;font-size:12.5px;color:var(--parchment)!important;text-shadow:0 0 1px #000,0 0 1px #000,0 0 3px #000}
.lbl{font-family:var(--font-label);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}

/* 1: gutter letter */
.v1 .grp{display:grid;grid-template-columns:22px 1fr;column-gap:8px}
.v1 .grp + .grp{border-top:1px solid var(--hair);margin-top:4px;padding-top:4px}
.v1 .k{font-family:var(--font-display);font-size:20px;color:var(--text-3);line-height:1;padding-top:7px;text-align:center}

/* 2: left rail */
.v2 .grp{position:relative;padding-left:12px;margin:6px 0;border-left:2px solid var(--ink-4)}
.v2 .k{position:absolute;left:-10px;top:-1px;background:var(--ink-2);font-size:10px;padding:2px 0}
.v2 .grp{padding-top:0}
.v2 .cap{font-size:10px;padding-top:4px;line-height:1}

/* 3: no headers, deck tag trailing the detected line */
.v3 .grp + .grp{border-top:1px solid var(--hair);margin-top:4px;padding-top:4px}
.v3 .tag{font-family:var(--font-label);font-size:10px;letter-spacing:.12em;color:var(--text-3);margin-left:8px;padding:1px 6px;border:1px solid rgba(252,249,209,.14);border-radius:999px;vertical-align:2px}

/* 4: card-back header */
.v4 .h{display:flex;align-items:center;gap:8px;padding:8px 0 2px;font-size:13px;color:var(--text-2)}
.v4 .h img{width:16px;height:22px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.v4 .h .n{font-family:var(--font-display);font-size:15px;color:var(--sand)}
.v4 .grp:first-child .h{padding-top:2px}

/* 5: two columns */
.v5 .bd{display:grid;grid-template-columns:1fr 1fr;gap:0}
.v5 .grp{padding:0 8px}
.v5 .grp + .grp{border-left:1px solid var(--hair)}
.v5 .k{font-size:10px;padding:6px 0 2px;text-align:center}
.v5 .line{font-size:14px;line-height:1.45;padding:4px 0;text-align:center}

/* 6: plain gap */
.v6 .grp + .grp{margin-top:12px}
</style></head><body>

<h1>Spice blow headers: variants</h1>
<p>Each variant shows a normal turn on the left and a turn with a worm in Blow A on the right.</p>
<div id="out"></div>

<script>
const S = n => `<span class="spice-amt"><img src="../../treachery-online/Client/wwwroot/art/ActiveSpice.svg"><b>${n}</b></span>`;
const nav = `<div class="nav"><div class="arr l">‹</div><div class="mid"><div class="t">TURN 2</div><div class="p">Spice Blow</div></div><div class="arr">›</div></div>`;
const simple = {A:[`${S(8)} detected in <b>The Minor Erg</b>`], B:[`${S(10)} detected in <b>South Mesa</b>`]};
const busy = {A:[`<b>Shai-Hulud</b> devours ${S(6)} in <b>Hagga Basin</b>`, `<b>Shai-Hulud</b> appears in <b>Hagga Basin</b>`, `${S(8)} detected in <b>The Minor Erg</b>`], B:[`${S(10)} detected in <b>South Mesa</b>`]};
const L = ls => ls.map(l => `<div class="line">${l}</div>`).join("");

const variants = [
  ["Deck letter in the gutter",
   "No header rows. The deck letter sits in a narrow column to the left of its lines, and a hairline separates the two groups.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp"><div class="k">${k}</div><div>${L(ls)}</div></div>`).join("")],
  ["Left rail",
   "Each blow is a group with a thin rail down its left edge and a tiny label at the top. Same idea as the battle groups in the turn report.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp"><div class="lbl cap">Blow ${k}</div>${L(ls)}</div>`).join("")],
  ["Deck tag on the detected line",
   "No headers at all. The line that says where spice landed gets a small A or B tag. Worm lines are grouped above it by a hairline.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp">${L(ls.map(l => l.includes("detected") ? l + `<span class="tag">${k}</span>` : l))}</div>`).join("")],
  ["Card-back header",
   "The header is a tiny spice card back plus the deck name, so it reads as \"this card was drawn\" instead of a section title.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp"><div class="h"><img src="../../treachery-online/Client/wwwroot/art/SpiceBack.gif"><span class="n">Deck ${k}</span></div>${L(ls)}</div>`).join("")],
  ["Two columns",
   "A and B side by side. Compact and symmetric, but long lines wrap and an uneven turn (worm in A only) looks lopsided.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp"><div class="lbl k">Blow ${k}</div>${L(ls)}</div>`).join("")],
  ["Just a gap",
   "Drop the headers entirely and leave a little extra space between the groups. Assumes nobody needs to know which deck was which.",
   d => Object.entries(d).map(([k, ls]) => `<div class="grp">${L(ls)}</div>`).join("")],
];

document.getElementById("out").innerHTML = variants.map(([title, desc, f], i) =>
  `<h2>${i + 1}. ${title}</h2><p>${desc}</p><div class="row">` +
  [simple, busy].map(d => `<div class="panel v${i + 1}">${nav}<div class="bd">${f(d)}</div></div>`).join("") +
  `</div>`).join("");
</script>
</body></html>
