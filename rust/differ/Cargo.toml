[package]
name = "differ"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replays C# oracle traces through the Rust engine and reports the first difference."

[dependencies]
treachery-engine = { path = "../engine" }
treachery-bots = { path = "../bots" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
flate2 = "1"
sha2 = "0.10"
