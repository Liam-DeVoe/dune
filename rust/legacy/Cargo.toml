[package]
name = "treachery-legacy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The event and savegame JSON of game version 190 and before (System.Text.Json's format, from the C# version). The server reads it once to convert old savegames and stored games; the harness reads and writes it for traces of a reference that records it. See rust/docs/engine-conventions.md, \"JSON\"."

[dependencies]
treachery-engine = { path = "../engine" }
dotnet-compat = { path = "../dotnet-compat" }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.10"
