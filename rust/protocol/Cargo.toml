[package]
name = "treachery-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Every message between the web client and the server: calls, replies, notifications and lobby objects, with their TypeScript types. See rust/docs/protocol.md."

[dependencies]
# The game view, draft results and reports that some replies and notifications carry.
treachery-view = { path = "../view" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
