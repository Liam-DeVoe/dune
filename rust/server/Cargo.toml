[package]
name = "treachery-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of treachery-online/Server (the SignalR GameHub) to axum + sqlx. See rust/docs/server-plan.md."

[dependencies]
treachery-engine = { path = "../engine" }
treachery-skin = { path = "../skin" }
# The bots the server runs for seats without a user (GameHub_GameEvents.cs PerformBotEvent).
treachery-bots = { path = "../bots" }
dotnet-compat = { path = "../dotnet-compat" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde_json = { version = "1", features = ["preserve_order"] }
# String.Normalize(NormalizationForm.FormC) in MailAddress parsing (mail.rs).
unicode-normalization = "0.1"
# Views for each member of a game group (src/views.rs), serialized with serde.
treachery-view = { path = "../view" }
# RandomIds (runtime.rs): the OS CSPRNG, as RandomNumberGenerator and Guid.NewGuid use.
getrandom = "0.3"
# SmtpMailer (mail.rs): SMTP with STARTTLS, as SmtpClient with EnableSsl.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
