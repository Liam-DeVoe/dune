[package]
name = "treachery-skin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of Shared/Model/Skin.cs and Shared/DefaultSkin.cs: the text (and art references) the server and the view layer render messages with."

[dependencies]
treachery-engine = { path = "../engine" }
dotnet-compat = { path = "../dotnet-compat" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
differ = { path = "../differ" }
