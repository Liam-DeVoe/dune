[package]
name = "treachery-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Per-player game views and action options built from the engine, for the server and the React client. See rust/docs/client-plan.md."

[dependencies]
treachery-engine = { path = "../engine" }
treachery-skin = { path = "../skin" }
dotnet-compat = { path = "../dotnet-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[dev-dependencies]
flate2 = "1"
