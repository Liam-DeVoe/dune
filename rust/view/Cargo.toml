[package]
name = "treachery-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Per-player game views and action options built from the engine, for the server and the React client. See rust/docs/client.md."

[dependencies]
treachery-engine = { path = "../engine" }
treachery-skin = { path = "../skin" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[dev-dependencies]
# Old savegames and event JSON in test data.
treachery-legacy = { path = "../legacy" }
flate2 = "1"
