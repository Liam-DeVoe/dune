<!DOCTYPE html>

    <script type="text/javascript">

        const LoggingEnabled = false;

        function GetLocalStorageKeys() {

            let result = [];
            for (let i = 0; i < localStorage.length; i++)
            {
                result.push(localStorage.key(i));
            }

            return result;
        }

        function MeasureText(text, font) {

            // re-use canvas object for better performance
            const canvas = MeasureText.canvas || (MeasureText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");

            context.font = font;
            const metrics = context.measureText(text);

            if ("fontBoundingBoxAscent" in metrics) {

                return {
                    Width: metrics.width,
                    Height: metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent,
                };
            }
            else {

                return {
                    Width: metrics.width,
                    Height: 1.4 * (metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent),
                };
            }
        }

        function SetPlanetMapScale() {

            try {

                planetmap = document.getElementById('planetmap');
                if (planetmap != null) {

                    mapdiv = document.getElementById('mapdiv');
                    if (mapdiv != null) {

                        planetmap_inner = document.getElementById('planetmap_inner');
                        scale = mapdiv.offsetWidth / planetmap_inner.offsetWidth;
                        planetmap.style.transform = 'scale(' + scale + ')';

                        planetmap_filler = document.getElementById('planetmap-filler');
                        planetmap_filler.style.height = scale * planetmap_inner.offsetHeight + "px";

                        ClampMapPin();
                    }
                }
            }
            catch {

            }
        }

        // Points the map's cursor arrows (line.mapsel-cursor) at the last
        // valid destination the mouse was over, trimmed like a pinned arrow so
        // it ends where clicking would put it. The arrows never follow the
        // mouse: they stay hidden until a destination is hovered, and moving
        // off it, whether onto a sector that cannot be clicked or off the map,
        // leaves them where they are. The valid destinations are listed by
        // MapSelectionOverlay.razor in data-targets. Called after the overlay
        // renders and by ShowMapHover when the hovered sector changes. The
        // last destination is forgotten once the arrows are gone, so a new
        // selection starts with nothing pointed at.
        var mapCursorTarget = null;

        function UpdateMapCursorArrows() {

            const inner = document.getElementById('planetmap_inner');
            if (inner == null) return;

            const arrows = inner.querySelector('.maparrows');
            const lines = inner.querySelectorAll('line.mapsel-cursor');
            if (arrows == null || lines.length == 0) {
                mapCursorTarget = null;
                return;
            }

            const targets = new Set((arrows.dataset.targets || '').split(',').filter(function (id) { return id !== ''; }));
            const hovered = inner.querySelector('.maphover .hover-shape.on');
            if (hovered != null && targets.has(hovered.dataset.locationId)) mapCursorTarget = hovered.dataset.locationId;

            const shape = mapCursorTarget != null && targets.has(mapCursorTarget)
                ? inner.querySelector('.maphover .hover-shape[data-location-id="' + mapCursorTarget + '"]')
                : null;
            const end = shape != null && shape.dataset.cx ? { x: Number(shape.dataset.cx), y: Number(shape.dataset.cy) } : null;

            lines.forEach(function (line) {
                if (end == null) {
                    line.setAttribute('visibility', 'hidden');
                    return;
                }
                const start = { x: Number(line.dataset.x1), y: Number(line.dataset.y1) };
                const segment = TrimMapArrow(start, end, 10, 12);
                line.setAttribute('x1', segment[0].x);
                line.setAttribute('y1', segment[0].y);
                line.setAttribute('x2', segment[1].x);
                line.setAttribute('y2', segment[1].y);
                line.removeAttribute('visibility');
            });
        }

        // Lets Escape or a right click on the map cancel a half-made move or
        // shipment. Only listens while there is something to cancel, so the
        // browser's own context menu keeps working the rest of the time.
        // Passing null stops listening.
        var mapCancelKeyHandler = null;
        var mapCancelMenuHandler = null;
        var mapCancelMenuTarget = null;

        function ListenForMapCancel(overlay) {

            if (mapCancelKeyHandler != null) {
                document.removeEventListener('keydown', mapCancelKeyHandler);
                mapCancelKeyHandler = null;
            }

            if (mapCancelMenuHandler != null) {
                mapCancelMenuTarget.removeEventListener('contextmenu', mapCancelMenuHandler);
                mapCancelMenuHandler = null;
                mapCancelMenuTarget = null;
            }

            if (overlay == null) return;

            mapCancelKeyHandler = function (e) {
                if (e.key !== 'Escape') return;
                // An open dialog or dropdown takes Escape first, and a field
                // outside the map keeps it.
                if (document.querySelector('.modal.show, [aria-expanded="true"]') != null) return;
                const t = e.target;
                const outsideMap = t == null || t.closest == null || t.closest('#planetmap_inner') == null;
                if (outsideMap && t != null && t.matches != null && t.matches('input, textarea, select, [contenteditable]')) return;
                overlay.invokeMethodAsync('CancelMapInteraction');
            };
            document.addEventListener('keydown', mapCancelKeyHandler);

            const inner = document.getElementById('planetmap_inner');
            if (inner == null) return;

            mapCancelMenuHandler = function (e) {
                e.preventDefault();
                overlay.invokeMethodAsync('CancelMapInteraction');
            };
            mapCancelMenuTarget = inner;
            inner.addEventListener('contextmenu', mapCancelMenuHandler);
        }

        // Same as Trim in MapSelectionOverlay.razor: keeps the arrow off the tokens at either end.
        function TrimMapArrow(a, b, fromStart, fromEnd) {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const length = Math.hypot(dx, dy);
            if (length < fromStart + fromEnd + 1) return [a, b];
            const ux = dx / length;
            const uy = dy / length;
            return [{ x: a.x + ux * fromStart, y: a.y + uy * fromStart }, { x: b.x - ux * fromEnd, y: b.y - uy * fromEnd }];
        }

        // Shows the shape of the sector under the mouse. The shapes are
        // rendered hidden by MapHover.razor; the one whose data-location-id
        // matches the hovered Planet location is switched on. Listeners are
        // delegated from the map so re-rendered locations keep working, and
        // calling this again after a render only refreshes the shown shape.
        var mapHoverInner = null;

        function StartMapHover() {

            const inner = document.getElementById('planetmap_inner');
            if (inner == null) return;

            if (mapHoverInner !== inner) {
                mapHoverInner = inner;
                inner.addEventListener('mouseover', function (e) {
                    const id = MapHoverLocation(e.target);
                    if (id != null) ShowMapHover(id);
                });
                inner.addEventListener('mouseout', function (e) {
                    if (MapHoverLocation(e.target) != null) ShowMapHover(null);
                });
            }

            ShowMapHover(MapHoverLocation(inner.querySelector('g[data-location-id]:not(.hover-shape):hover')));
        }

        function MapHoverLocation(element) {
            if (element == null || element.closest == null) return null;
            const group = element.closest('g[data-location-id]:not(.hover-shape)');
            return group == null ? null : group.dataset.locationId;
        }

        function ShowMapHover(locationId) {
            if (mapHoverInner == null) return;
            mapHoverInner.querySelectorAll('.maphover .hover-shape.on').forEach(function (shape) { shape.classList.remove('on'); });
            if (locationId == null) return;
            const shape = mapHoverInner.querySelector('.maphover .hover-shape[data-location-id="' + locationId + '"]');
            if (shape != null) shape.classList.add('on');
            UpdateMapCursorArrows();
        }

        // A chip in a sentence names sectors (data-ref-locations) and maybe a
        // faction (data-ref-faction). While the mouse is over it, those sectors
        // show their hover shape, tinted with the chip's --fc when it has one,
        // and anything tagged data-faction-of with that faction gets .ref-hi.
        // Listening on the document means chips work wherever a message is
        // rendered, and survive re-renders.
        document.addEventListener('mouseover', function (e) {
            const chip = e.target.closest == null ? null : e.target.closest('[data-ref-locations]');
            if (chip != null) ShowMapRefs(chip);
        });
        document.addEventListener('mouseout', function (e) {
            const chip = e.target.closest == null ? null : e.target.closest('[data-ref-locations]');
            if (chip != null && !chip.contains(e.relatedTarget)) ShowMapRefs(null);
        });

        function ShowMapRefs(chip) {
            document.querySelectorAll('.maphover .hover-shape.ref').forEach(function (shape) {
                shape.classList.remove('ref');
                shape.style.removeProperty('--c');
            });
            document.querySelectorAll('.ref-hi').forEach(function (el) { el.classList.remove('ref-hi'); });
            const lines = document.querySelector('.maprefs .lines');
            if (lines != null) lines.replaceChildren();
            if (chip == null) return;
            const color = getComputedStyle(chip).getPropertyValue('--fc').trim();

            // A log line that tells of a journey draws it when the mouse is on
            // the line's text. A chip inside the line lights its own sector only.
            const journey = chip.hasAttribute('data-ref-arrow') ? chip : null;
            if (journey != null && lines != null) {
                const arrowColor = getComputedStyle(journey).getPropertyValue('--fc').trim();
                // On the svg, not the group: the arrowhead markers sit in its defs.
                lines.closest('svg').style.setProperty('--c', arrowColor !== '' ? arrowColor : '#fff');
                journey.dataset.refArrow.split(';').forEach(function (segment) {
                    const n = segment.split(',').map(Number);
                    if (n.length !== 4) return;
                    const ends = TrimMapArrow({ x: n[0], y: n[1] }, { x: n[2], y: n[3] }, 10, 12);
                    ['arrow-outline', 'arrow'].forEach(function (cls) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('class', cls);
                        line.setAttribute('x1', ends[0].x); line.setAttribute('y1', ends[0].y);
                        line.setAttribute('x2', ends[1].x); line.setAttribute('y2', ends[1].y);
                        if (cls === 'arrow') line.setAttribute('marker-end', 'url(#mapref-head)');
                        lines.appendChild(line);
                    });
                });
            }
            chip.dataset.refLocations.split(',').forEach(function (id) {
                if (id === '') return;
                document.querySelectorAll('.maphover .hover-shape[data-location-id="' + id + '"]').forEach(function (shape) {
                    shape.classList.add('ref');
                    if (color !== '') shape.style.setProperty('--c', color);
                });
            });
            const faction = chip.dataset.refFaction;
            if (faction) document.querySelectorAll('[data-faction-of="' + faction + '"]').forEach(function (el) { el.classList.add('ref-hi'); });
        }

        // A panel pinned near the page's edge would run off it. This shifts
        // it back inside by setting --dx, which .map-pin adds to its
        // position while its caret stays over the anchor. The map is
        // CSS-scaled, so the shift is converted to map units. Runs after
        // every render of the panel and after the map is rescaled.
        function ClampMapPin() {

            const pin = document.querySelector('.map-pin');
            if (pin == null) return;

            const inner = document.getElementById('planetmap_inner');
            const scale = inner != null && inner.offsetWidth > 0 ? inner.getBoundingClientRect().width / inner.offsetWidth : 1;

            // Undo the current shift so the measurement is of the unshifted panel.
            const current = parseFloat(pin.style.getPropertyValue('--dx')) || 0;
            const rect = pin.getBoundingClientRect();
            const left = rect.left - current * scale;
            const right = rect.right - current * scale;

            const margin = 8;
            const max = document.documentElement.clientWidth - margin;
            let dx = 0;
            if (left < margin) dx = margin - left;
            else if (right > max) dx = max - right;

            pin.style.setProperty('--dx', (dx / scale) + 'px');
        }

        // Hover intel on locations would cover the panel pinned to a
        // destination, so it is switched off while a panel is pinned.
        function SetMapPopoversEnabled(enabled) {

            const inner = document.getElementById('planetmap_inner');
            if (inner == null) return;

            inner.querySelectorAll('[data-bs-toggle="popover"]').forEach(function (el) {
                const popover = bootstrap.Popover.getInstance(el);
                if (popover == null) return;
                if (enabled) {
                    popover.enable();
                } else {
                    popover.hide();
                    popover.disable();
                }
            });
        }

        function GetWindowDimensions() {

            try {

                determinedWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
                determinedHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            }
            catch (error) {

                determinedWidth = 800;
                determinedHeight = 600;
            }

            return { Width: determinedWidth, Height: determinedHeight };
        }

        function GetScreenDimensions() {

            return { Width: window.screen.width * window.devicePixelRatio, Height: window.screen.height * window.devicePixelRatio };
        }

        function GetImageDimensions(imgUrl) {

            return new Promise((resolve) => {
                let img = document.createElement('img');
                img.onload = () => {
                    resolve({ Width: img.naturalWidth, Height: img.naturalHeight });
                }
                img.onerror = () => {
                    resolve({ Width: 0, Height: 0 });
                }
                img.src = imgUrl;
            });
        }

        function RemoveFocusFromButtons() {

            document.querySelectorAll("button").forEach(item => item.blur());
        }

        function EnablePopover(element) {

            if (element == null) return;
            
            new bootstrap.Popover(element, { sanitize: false });
        }
                
        function EnablePopovers(element) {

            if (element == null) return;
            
            element.querySelectorAll('[data-bs-toggle="popover"]').forEach( function (trigger) { EnablePopover(trigger); } );
        }

        function RemovePopover(element) {

            if (element == null) return;
            
            var popover = bootstrap.Popover.getInstance(element);

            if (popover != null) {

                popover.dispose();
            }
        }

        function RemovePopovers(element) {

            if (element == null) return;
            
            element.querySelectorAll('[data-bs-toggle="popover"]').forEach( function (trigger) { RemovePopover(trigger); } );
        }

        function RefreshPopover(element) {

            if (element == null) return;
            
            var popover = bootstrap.Popover.getInstance(element);
            if (popover != null) {

                popover.dispose();
            }

            new bootstrap.Popover(element, { sanitize: false });
        }

        function RefreshPopovers(element) {
            
            if (element == null) return;
            
            element.querySelectorAll('[data-bs-toggle="popover"]').forEach( function (trigger) { RefreshPopover(trigger); } );
        }

        /*
         * Sounds
         */

        let currentSounds = new Map();
        function PlaySound(file, fadeTime, volume, loop) {

            let sound = currentSounds.get(file);
            if (sound != null)
            {
                sound.currentTime = 0;
                sound.play();
            }
            else
            {
                sound = new Audio(file);
                sound.loop = loop;

                currentSounds.set(file, sound);

                if (fadeTime > 0) {
                    fadeStepTimeInterval = fadeTime / 8;
                    fadeStepVolumeInterval = volume / 8;
                    var interval = setInterval(function () {
                        if (sound.volume + fadeStepVolumeInterval >= volume) {
                            clearInterval(interval);
                            sound.volume = volume;
                        }
                        else {
                            sound.volume += fadeStepVolumeInterval;
                        }
                    }, fadeStepTimeInterval)
                }
                else {

                    sound.volume = volume;
                }

                sound.play();
            }
        }

        function StopSound(file, fadeTime) {

            let sound = currentSounds.get(file);         

            if (sound != null)
            {
                if (fadeTime > 0)
                {
                    fadeStepTimeInterval = fadeTime / 8;
                    fadeStepVolumeInterval = sound.volume / 8;
                    var interval = setInterval(function ()
                    {
                        if (sound.volume <= fadeStepVolumeInterval)
                        {
                            clearInterval(interval);
                            sound.pause();
                            currentSounds.delete(file);
                        }
                        else
                        {
                            sound.volume -= fadeStepVolumeInterval;
                        }
                    }, fadeStepTimeInterval)
                }
                else
                {
                    sound.pause();
                    currentSounds.delete(file);
                }

            }
        }

        function StopSounds(fadeTime) {

            currentSounds.forEach((values, key) => {
                StopSound(key, fadeTime);
            })
        }

        function ChangeSoundVolume(file, volume) {

            let sound = currentSounds.get(file);

            if (sound != null) {

                sound.volume = volume;
            }
        }

        /*
         * Read and write files locally
         */

        function saveFile(filename, data) {
            const blob = new Blob([data], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            let link = document.createElement('a');
            link.download = filename;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function readFile(inputFile) {

            const temporaryFileReader = new FileReader();
            return new Promise((resolve, reject) => {

                temporaryFileReader.onerror = () => {
                    temporaryFileReader.abort();
                    reject(new DOMException("Problem parsing input file."));
                };

                temporaryFileReader.addEventListener("load", function () {
                    resolve(temporaryFileReader.result);
                }, false);

                temporaryFileReader.readAsText(inputFile.files[0]);
            });
        }

        function Clear(id) {

            document.getElementById(id).value = "";
        }

        function UrlExists(url) {

            let img = new Image();

            return new Promise(

                (resolve) => {

                    img.onerror = () => {
                        resolve(false);
                    };

                    img.onload = () => {
                        resolve(true);
                    };

                    img.src = url;

                });
        }

        /*
         * Other support functions
         */

        function ClearSelection() {

            if (window.getSelection) { window.getSelection().removeAllRanges(); }
            else if (document.selection) { document.selection.empty(); }
        }

        function HideModal(modalId) {

            let element = document.getElementById(modalId);
            let modal = bootstrap.Modal.getInstance(element);

            if (modal != null) {

                modal.hide();
            }
        }

        // Escape goes to the most recent listener still registered, so an
        // open menu closes before the undo panel under it.
        const escapeTargets = [];
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && escapeTargets.length) escapeTargets[escapeTargets.length - 1].target.invokeMethodAsync("OnEscape");
        });

        function ListenForEscape(key, dotNetObject) {
            StopListeningForEscape(key);
            escapeTargets.push({ key: key, target: dotNetObject });
        }

        function StopListeningForEscape(key) {
            const i = escapeTargets.findIndex(t => t.key === key);
            if (i >= 0) escapeTargets.splice(i, 1);
        }

        function ToggleFullScreen() {

            let element = document.body;
            let isFullscreen = IsFullScreen();

            element.requestFullScreen = element.requestFullScreen || element.webkitRequestFullScreen || element.mozRequestFullScreen || function () { return false; };
            document.cancelFullScreen = document.cancelFullScreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || function () { return false; };

            isFullscreen ? document.cancelFullScreen() : element.requestFullScreen();
        }

        function IsFullScreen() {

            return document.fullscreenElement != null
        }

        function Print(elementId) {

            let elem = document.getElementById(elementId);
            let domClone = elem.cloneNode(true);
            let printSection = document.getElementById("printSection");

            if (!printSection) {

                printSection = document.createElement("div");
                printSection.id = "printSection";
                document.body.appendChild(printSection);
            }

            printSection.innerHTML = "";
            printSection.appendChild(domClone);
            window.print();
        }

        function Log(text) {

            if (LoggingEnabled) {

                console.log(text);
            }
        }

    </script>
